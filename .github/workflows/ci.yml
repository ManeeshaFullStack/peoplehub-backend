name: CI

# Required checks for branch protection on `main` (Spec 16.2): `build` and `secret-scan`.
# `compose-smoke` (B0-7) is deliberately NOT a required check yet; the owner decides when it becomes one, in GitHub's
# branch protection settings.
# SAST, dependency scan, SBOM and the OpenAPI breaking-change check are queued follow-ups (see CLAUDE.md).

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same PR/branch supersedes the running one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (the trailing comment is the release they resolve to).
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Maven wrapper must be committed executable (mode 100755) or every later step fails with a confusing error.
      - name: Verify mvnw is committed executable
        run: |
          mode="$(git ls-files -s mvnw | cut -d' ' -f1)"
          if [ "$mode" != "100755" ]; then
            echo "::error file=mvnw::mvnw is committed with mode $mode, expected 100755 (git update-index --chmod=+x mvnw)"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # compile + unit/integration tests (Testcontainers start real PostgreSQL and Redis; Docker is preinstalled on
      # ubuntu-latest) + Spotless format check (google-java-format, AOSP), which is bound to `verify`.
      - name: Build, test and lint
        run: ./mvnw -B -ntp verify

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Pinned release; the checksum comes from the release's own gitleaks_<version>_checksums.txt.
      # To upgrade: bump both values together and re-run this job.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # Scans every commit reachable from the checkout. Known false positives are exact fingerprints in
      # .gitleaksignore (never path-wide allowlists). --redact keeps any finding out of the CI log.
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --verbose --no-banner --exit-code 1 .

  # Builds the backend image and boots the development stack (docker-compose.yml) from empty volumes, then checks what a
  # deployment must get right: healthy services, the two database roles (the runtime role cannot change the audit log),
  # hardening and limits on every container, loopback-only ports, restart on an existing volume, and graceful shutdown
  # within the 90s stop grace period. The logic is docker/smoke.sh, which also runs on a developer's machine. Not a
  # required check yet (see the note at the top of this file).
  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The script generates random throwaway secrets, uses its own compose project and ports, and tears everything
      # down (also on failure, after printing the container logs). Nothing here is a real credential.
      - name: Compose smoke test
        run: bash docker/smoke.sh
