spring:
  application:
    name: peoplehub-backend

  # Connection settings come from the environment via Spring's standard relaxed binding
  # (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
  #  SPRING_DATA_REDIS_HOST, SPRING_DATA_REDIS_PORT, SPRING_DATA_REDIS_PASSWORD). See .env.example.
  # Nothing secret or environment-specific is defined here; a missing value fails fast at startup.

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway. Hibernate only verifies that entities match it (Spec 16.2, CLAUDE.md 9).
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # Forward-only migrations (Spec 2, 16.2): never clean, never reorder, never baseline over existing data.
    clean-disabled: true
    validate-on-migrate: true
    out-of-order: false
    baseline-on-migrate: false
    # Migrations run as the migration/owner role, the application as the least-privileged runtime role: set
    # SPRING_FLYWAY_USER / SPRING_FLYWAY_PASSWORD (and SPRING_FLYWAY_URL if the runtime URL is a pooler) next to
    # SPRING_DATASOURCE_*. Flyway never creates roles; see README, "Database roles".
    placeholders:
      # Name of the runtime role that migrations grant privileges to (V3 onwards). Lower-case identifier only:
      # RuntimeRolePlaceholderGuard refuses anything else at startup, before Flyway runs, because the value is
      # substituted into SQL text. The role must already exist.
      runtime_role: ${PEOPLEHUB_DB_RUNTIME_ROLE:peoplehub_app}

  data:
    redis:
      timeout: 2s
      connect-timeout: 2s

  # Plain SMTP (Spec 9.2, b1-2): host/port default to Mailpit's usual local port so
  # ./mvnw spring-boot:test-run and every test keep needing NO environment variables (matching
  # .env.example's own promise) and so the JavaMailSender bean always exists -- without a resolved
  # spring.mail.host, Spring Boot does not create one, and every bean depending on it would fail to
  # wire. Only host/port get a default: authentication and STARTTLS stay off unless the environment
  # sets SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD / SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE
  # (Brevo's SMTP relay in production). No provider-specific configuration lives here.
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

  lifecycle:
    # [confirm] The spec gives no number: 30s is a default, not an approved value. Override per
    # environment with SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE. Each shutdown phase (web server,
    # then scheduler) gets this long, so shutdown can take up to twice it plus the 5s job unwind
    # period below (65s). The orchestrator's stop grace period must be 90s or more, not just above
    # this value, or the container is killed mid-shutdown (CLAUDE.md, B0-5 decisions).
    timeout-per-shutdown-phase: 30s

  task:
    scheduling:
      thread-name-prefix: scheduler-
      pool:
        # [confirm] Spring's default is 1 thread, so one slow job would delay every other job. 4 is a
        # default, not an approved value. Override with SPRING_TASK_SCHEDULING_POOL_SIZE.
        size: 4
      shutdown:
        # A running job gets up to spring.lifecycle.timeout-per-shutdown-phase (30s, above) to finish
        # on shutdown; if it is still running then it is INTERRUPTED and fails cleanly (Spec 16.4).
        # Measured, not assumed (ScheduledJobInstancesTest):
        #  - await-termination must stay false. With true, Spring ignores that timeout for jobs, waits
        #    only for await-termination-period, then ABANDONS a still-running job: it keeps running
        #    while the database pool closes underneath it and its lock is never released.
        #  - With false, Spring interrupts the job but does NOT wait for it to unwind unless a period
        #    is set: the pool then closes while the job is still releasing its lock, the unlock fails
        #    and the lock stays held until lockAtMostFor. The short period below is that unwinding
        #    time, not a second wait for the job to finish. [confirm]
        #  - Shutdown phases run one after another: the web server (slow requests) and then the
        #    scheduler (slow jobs) each get the full timeout. A single slow request, or a single slow
        #    job, is bounded by its own 30s; a slow request AND a slow job together take up to two
        #    (60s), plus this period: 65s. The orchestrator's stop grace period must be 90s or more
        #    (CLAUDE.md, B0-5 decisions).
        await-termination: false
        await-termination-period: 5s

server:
  # Finish in-flight requests (and, later, scheduled jobs) before the container stops (Spec 16.4).
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        # Health only. Metrics are collected but the endpoint stays unexposed until authentication
        # exists (B2): actuator is an unauthenticated surface, so nothing else is published on it.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Status only: component names, driver versions and error text never leave the app.
      show-details: never
      show-components: never
      group:
        # Liveness = "is the process alive". It deliberately ignores the database and Redis, so a
        # brief outage of either cannot get the container restarted. Container health checks use
        # /actuator/health/liveness. (Spec 16.4 names /actuator/health for this; see CLAUDE.md.)
        liveness:
          include: livenessState
        # Readiness = "can it serve traffic": also verifies PostgreSQL and Redis.
        readiness:
          include: readinessState,db,redis
  health:
    mail:
      # Spring Boot auto-registers a mail health contributor the moment spring-boot-starter-mail
      # sees a JavaMailSender bean (b1-2), and -- unlike liveness/readiness, whose *members* are an
      # explicit allowlist above -- the root /actuator/health endpoint aggregates every registered
      # contributor with no such list, so an unreachable SMTP server would drag the whole aggregate
      # to DOWN/503 (D1: root is the full aggregate). This is disabled on purpose, consistent with
      # this project's own health design (D1): only dependencies that should actually gate traffic
      # or a restart are health-checked (db/redis on readiness), and SMTP reachability deliberately
      # is not one of them -- a temporarily unreachable SMTP server is exactly the kind of transient
      # failure EmailOutboxProcessor's retry/backoff already exists to absorb (Spec 9.2), not an
      # application-health emergency. MailHealthDoesNotAffectOverallHealthTest proves this against a
      # deliberately unreachable host, not by coincidence of what happens to be listening locally.
      enabled: false

logging:
  structured:
    format:
      # One JSON object per line (Spec 14.1) with MDC (correlationId, actorId) and key/values.
      # The `local` profile turns this off for readable console output.
      console: logstash
    json:
      stacktrace:
        # Exception messages can hold personal data (a Postgres unique violation quotes the key), so
        # traces are rendered without them. See MessageFreeStackTracePrinter.
        printer: com.peoplehub.common.logging.MessageFreeStackTracePrinter
  level:
    # Environment-driven: override with LOGGING_LEVEL_ROOT / LOGGING_LEVEL_COM_PEOPLEHUB. INFO
    # everywhere except the `local` profile; never ship DEBUG or verbose SQL by default (Spec 14.1).
    root: INFO
    # Hibernate logs the database's own error text as a log *message* (not an exception), which for
    # a unique violation includes the offending value ("Key (email)=(...) already exists"). The
    # exception still propagates and is logged by GlobalExceptionHandler without its message. This
    # is Hibernate 7's category for it; DatabaseErrorLoggingTest fails if that name changes.
    org.hibernate.orm.jdbc.error: "OFF"

peoplehub:
  scheduling:
    # [confirm] How long a job's lock is held if the instance running it dies without releasing it,
    # unless the job's @SchedulerLock says otherwise (ISO-8601). It must exceed the longest run of
    # any job using the default; the spec gives no number, so 10 minutes is a default, not an
    # approved value. Override with PEOPLEHUB_SCHEDULING_DEFAULT_LOCK_AT_MOST_FOR.
    default-lock-at-most-for: PT10M

  # Email outbox processor (Spec 9.2, b1-2): EmailOutboxProcessorJob / EmailOutboxProcessor. All
  # [confirm] -- approved defaults for now, not confirmed production values.
  email:
    outbox:
      # How often the processor looks for due rows (ISO-8601 or a plain duration like "30s").
      interval: 30s
      # At most this many due rows per run, so one run stays short and predictable.
      batch-size: 100
      # This job's own ShedLock timeout, shorter than the scheduling default above because it runs
      # far more often: a stuck run should not hold the lock for 10 minutes.
      lock-at-most-for: PT2M
      # A row stuck in SENDING longer than this (only possible if the process crashed mid-send,
      # since ShedLock prevents a merely slow run from causing it) is reclaimed on the next run.
      stale-claim-after: PT5M
    retry:
      # Comma-separated ISO-8601 delays (Spec 9.2: "3 attempts over minutes"). One initial attempt
      # plus one retry per delay listed here, so PT1M,PT5M means 3 attempts in total. Override with
      # PEOPLEHUB_EMAIL_RETRY_DELAYS.
      delays: PT1M,PT5M
    # from-address (PEOPLEHUB_EMAIL_FROM_ADDRESS) is REQUIRED, with no default and no placeholder
    # value: deliberately not declared here at all, the same as spring.datasource.* above -- Spring's
    # standard relaxed binding exposes the environment variable as peoplehub.email.from-address on
    # its own, with nothing secret or environment-specific defined in this file. When unset it
    # resolves to Java null (EmailSendingConfig's own #{null} SpEL fallback, not an empty string),
    # and SmtpEmailSender refuses to send while it is null or blank. See its Javadoc.
    # webhook-secret (PEOPLEHUB_EMAIL_WEBHOOK_SECRET, b1-4) is REQUIRED, with the same "not declared
    # here, no fake default" treatment as from-address above: an unset variable resolves to Java
    # null (EmailWebhookController's own #{null} SpEL fallback), and WebhookSignatureVerifier fails
    # every signature check closed while it is null or blank -- the endpoint stays up, every request
    # to it is simply rejected as unauthorized, rather than refusing the whole application to start.

sentry:
  # SENTRY_DSN, SENTRY_ENVIRONMENT and SENTRY_RELEASE come from the environment (see .env.example).
  # With no DSN Sentry is disabled and nothing leaves the process.
  send-default-pii: false
  attach-server-name: false
  # No breadcrumbs: log text can carry values, and the correlation id already ties an event to logs.
  max-breadcrumbs: 0
  # Promote these MDC keys to event tags (the scrubber allowlists exactly these).
  context-tags: correlationId,actorId
  # Run Sentry's exception resolver last (default: first) so GlobalExceptionHandler answers first.
  # Otherwise every handled 4xx would be reported. Unexpected errors still reach Sentry through the
  # ERROR log record GlobalExceptionHandler writes.
  exception-resolver-order: 2147483647
  logging:
    minimum-event-level: error

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    # Off by default: it is an unauthenticated surface until authentication exists (B2). Enable it locally
    # with SPRINGDOC_SWAGGER_UI_ENABLED=true. The JSON at /v3/api-docs stays on for contract tooling.
    enabled: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
